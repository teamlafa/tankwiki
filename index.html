<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tank Encyclopedia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topBar">
    <div class="logo">
        🛡️ Tank Encyclopedia
    </div>

    <button onclick="openProfile()" class="profileBtn">
        👤
    </button>
</header>


<main>

    <section class="hero">

        <div>
            <p class="miniTitle">WORLD OF TANKS</p>

            <h1>
                Tanklar<br>
                <span>Encyclopedia</span>
            </h1>

            <p class="heroText">
                Dunyodagi mashhur tanklar haqida
                tarixiy va texnik ma'lumotlarni o'rganing.
            </p>
        </div>

    </section>


    <div class="searchArea">

        <div class="searchBox">
            🔎

            <input
                id="searchInput"
                type="text"
                placeholder="Tank qidirish..."
                oninput="searchTanks()"
            >

        </div>

    </div>


    <div class="categories">

        <button onclick="filterCountry('all')">
            Barchasi
        </button>

        <button onclick="filterCountry('Rossiya')">
            🇷🇺 Rossiya
        </button>

        <button onclick="filterCountry('Germaniya')">
            🇩🇪 Germaniya
        </button>

        <button onclick="filterCountry('AQSh')">
            🇺🇸 AQSh
        </button>

        <button onclick="filterCountry('Buyuk Britaniya')">
            🇬🇧 Britaniya
        </button>

        <button onclick="filterCountry('Fransiya')">
            🇫🇷 Fransiya
        </button>

    </div>


    <section>

        <div class="sectionTitle">

            <div>
                <p>ENCYCLOPEDIA</p>
                <h2>Mashhur tanklar</h2>
            </div>

            <span id="tankCount">
                101 tank
            </span>

        </div>


        <div
            id="tankList"
            class="tankGrid"
        ></div>

    </section>

</main>


<!-- TANK INFO -->

<div
    id="tankModal"
    class="modal hidden"
    onclick="closeModalOutside(event)"
>

    <div class="modalBox">

        <button
            class="closeBtn"
            onclick="closeTank()"
        >
            ×
        </button>

        <div id="tankDetails"></div>

        <div class="tankActions">

            <button onclick="saveTank()">
                ⭐ Saqlash
            </button>

            <button onclick="shareTank()">
                ↗ Ulashish
            </button>

            <button onclick="downloadTank()">
                ↓ Yuklash
            </button>

        </div>

    </div>

</div>


<!-- PROFILE -->

<div
    id="profileModal"
    class="modal hidden"
>

    <div class="modalBox profileModal">

        <button
            class="closeBtn"
            onclick="closeProfile()"
        >
            ×
        </button>

        <div class="bigProfile">
            👤
        </div>

        <h2>Profil</h2>

        <p>
            Tank Encyclopedia foydalanuvchisi
        </p>

        <button
            class="logoutBtn"
            onclick="closeProfile()"
        >
            Yopish
        </button>

    </div>

</div>


<nav class="bottomNav">

    <button onclick="home()">
        🏠
        <small>Bosh sahifa</small>
    </button>

    <button onclick="searchFocus()">
        🔎
        <small>Qidiruv</small>
    </button>

    <button onclick="home()" class="homeButton">
        🛡️
    </button>

    <button onclick="openProfile()">
        👤
        <small>Profil</small>
    </button>

    <button onclick="about()">
        ℹ️
        <small>Haqida</small>
    </button>

</nav>


<script src="script.js"></script>

</body>
</html>
