<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Encyclopedia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <span>🛡️</span>
        <b>Tank Encyclopedia</b>
    </div>

    <button class="profile-btn" onclick="openProfile()">👤</button>
</header>

<div class="search-box">
    <input
        id="searchInput"
        type="text"
        placeholder="Tank qidirish..."
        oninput="searchTanks()"
    >
    <span>🔍</span>
</div>

<div class="filters">
    <button class="filter active" onclick="filterCountry('all', this)">
        Barchasi
    </button>

    <button class="filter" onclick="filterCountry('SSSR', this)">
        🇷🇺 Rossiya
    </button>

    <button class="filter" onclick="filterCountry('Germaniya', this)">
        🇩🇪 Germaniya
    </button>

    <button class="filter" onclick="filterCountry('AQSh', this)">
        🇺🇸 AQSh
    </button>
</div>

<main>

    <div class="section-title">
        <div>
            <small>ENCYCLOPEDIA</small>
            <h1>Mashhur tanklar</h1>
        </div>

        <span id="tankCount">0 tank</span>
    </div>

    <div id="tankContainer" class="tank-grid"></div>

</main>

<!-- TANK MA'LUMOTI -->

<div id="tankModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeTank()">×</button>

        <img id="modalImage" class="modal-image">

        <div class="modal-info">

            <small id="modalCountry"></small>

            <h2 id="modalName"></h2>

            <p id="modalYear"></p>

            <p id="modalDescription"></p>

            <div class="buttons">
                <button onclick="saveTank()">♡ Saqlash</button>
                <button onclick="shareTank()">↗ Ulashish</button>
            </div>

        </div>

    </div>

</div>

<!-- PROFIL -->

<div id="profileModal" class="modal">

    <div class="profile-panel">

        <button class="close" onclick="closeProfile()">×</button>

        <div class="profile-icon">👤</div>

        <h2>Profil</h2>

        <p>Tank Encyclopedia</p>

        <button class="profile-button">
            🔐 Kirish
        </button>

        <button class="profile-button">
            📝 Ro‘yxatdan o‘tish
        </button>

    </div>

</div>

<!-- PASTKI MENU -->

<nav class="bottom-nav">

    <button onclick="goHome()">
        🏠
        <span>Bosh sahifa</span>
    </button>

    <button onclick="focusSearch()">
        🔍
        <span>Qidiruv</span>
    </button>

    <button class="center-button" onclick="goHome()">
        🛡️
    </button>

    <button onclick="openProfile()">
        👤
        <span>Profil</span>
    </button>

    <button onclick="showAbout()">
        ℹ️
        <span>Haqida</span>
    </button>

</nav>

<script src="script.js"></script>

</body>
</html>
